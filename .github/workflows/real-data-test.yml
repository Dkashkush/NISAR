# Runs OpenSAR Explorer on REAL NISAR + Sentinel-1 data on GitHub's servers and keeps the results.
#
# One-time setup: create a free NASA Earthdata token (urs.earthdata.nasa.gov -> Generate Token), then in this
# repository: Settings -> Secrets and variables -> Actions -> New repository secret, name EARTHDATA_TOKEN.
# Run it: Actions tab -> "Real-data test" -> Run workflow -> choose a test site.
# Results: the run's Summary page, plus a downloadable "results" artifact (report, maps, GeoTIFFs, metrics).

name: Real-data test

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Test site"
        type: choice
        options: [central_valley, mexico_city, tehran]
        default: central_valley
      max_pairs:
        description: "Image pairs per satellite (more = longer period, less noise)"
        type: choice
        options: ["4", "8", "16", "24", "32"]
        default: "16"
      s1_source:
        description: "Sentinel-1 product type (AUTO = as in the site's config)"
        type: choice
        options: [AUTO, ARIA_S1_GUNW, OPERA_DISP_S1, HYP3]
        default: AUTO
      hyp3:
        description: "ASF HyP3 Sentinel-1 orders: check = plan pairs and show credits/jobs (nothing ordered); order = submit them (uses free HyP3 credits; jobs are public)"
        type: choice
        options: [check, order, skip]
        default: check

concurrency:
  group: real-data-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      SITE: ${{ inputs.site }}
      MAX_PAIRS: ${{ inputs.max_pairs }}
      S1_SOURCE: ${{ inputs.s1_source }}
      HYP3: ${{ inputs.hyp3 }}
    steps:
      - name: Check the Earthdata token
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN secret is not set. See the setup notes at the top of .github/workflows/real-data-test.yml."
            exit 1
          fi
          case "$SITE" in central_valley|mexico_city|tehran) ;; *) echo "::error::unknown site $SITE"; exit 1;; esac
          case "$S1_SOURCE" in AUTO|ARIA_S1_GUNW|OPERA_DISP_S1|HYP3) ;; *) echo "::error::unknown s1_source"; exit 1;; esac
          case "$HYP3" in check|order|skip) ;; *) echo "::error::unknown hyp3 option"; exit 1;; esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Check the Earthdata login (opens one real file per satellite)
        run: |
          python - <<'PY'
          import os, sys
          from sarcompare.config import Config
          from sarcompare.download import describe_token, make_session
          from sarcompare.remote import AccessError, probe
          from sarcompare.search import search_nisar, search_sentinel1

          print("Token:", describe_token(os.environ.get("EARTHDATA_TOKEN")))
          session = make_session()
          ok, why = session.token_check or (True, "not used (logged in another way)")
          print("Earthdata pre-check:", why if ok else f"{why} (not fatal; testing real files next)")
          cfg = Config.from_yaml(f"examples/{os.environ['SITE']}.yaml")
          aoi = cfg.get_aoi()
          finders = [("NISAR", lambda: search_nisar(aoi, cfg.start, cfg.end, max_results=3)),
                     ("Sentinel-1 ARIA", lambda: search_sentinel1(aoi, "ARIA_S1_GUNW", cfg.start, cfg.end, max_results=3)),
                     ("Sentinel-1 OPERA", lambda: search_sentinel1(aoi, "OPERA_DISP_S1", cfg.start, cfg.end, max_results=3))]
          refused = False
          for label, find in finders:
              try:
                  products = [p for p in find() if p.url]
              except Exception as e:
                  print(f"::warning title={label} search::{type(e).__name__}: {e}")
                  continue
              if not products:
                  print(f"{label}: no products here to test")
                  continue
              p = products[0]
              try:
                  final, size = probe(p.url, session)
                  print(f"{label}: OK, opened {p.url.rsplit('/', 1)[-1]} ({size / 1e9:.2f} GB); partial reads work")
              except AccessError as e:
                  refused = True
                  print(f"::error title={label} file refused::{e}")
              except Exception as e:
                  print(f"::warning title={label}::{type(e).__name__}: {e} (the file will be downloaded in full instead)")
          sys.exit(1 if refused else 0)
          PY

      - name: Prepare disk space
        run: |
          sudo mkdir -p /mnt/sar && sudo chown "$USER" /mnt/sar
          df -h / /mnt

      - name: 1. Search (what data exists)
        run: sarcompare --debug search "examples/$SITE.yaml" --max-pairs "$MAX_PAIRS" --s1-source "$S1_SOURCE"

      - name: 2. Download, compare and validate
        run: sarcompare --debug run "examples/$SITE.yaml" --max-pairs "$MAX_PAIRS" --data-dir /mnt/sar --s1-source "$S1_SOURCE"

      - name: 3. Results summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          site = os.environ["SITE"]
          path = pathlib.Path("outputs") / site / "metrics.json"
          out = []
          if not path.exists():
              out.append(f"## {site}: no results\n\nThe run stopped before producing results; see the step logs above.")
          else:
              m = json.loads(path.read_text())
              c = m["comparison"]
              def f(v, nd=1):
                  return "n/a" if v is None or v != v else f"{v:.{nd}f}"
              def pct(v):
                  return "n/a" if v is None or v != v else f"{v:.0%}"
              # columns: the satellites that had data (one of them can be missing for an area)
              cols = [(k, label) for k, label in (("nisar", "NISAR"), ("sentinel1", "Sentinel-1")) if m.get(k)]
              ab = {cols[0][0]: "a", **({cols[1][0]: "b"} if len(cols) > 1 else {})}
              out.append(f"## {site}: real-data results\n")
              missing = [label for k, label in (("nisar", "NISAR"), ("sentinel1", "Sentinel-1")) if not m.get(k)]
              if missing:
                  out.append(f"**{missing[0]} had no usable data here; the run used {cols[0][1]} alone.**\n")
              out.append("| | " + " | ".join(label for _, label in cols) + " |\n|---|" + "---|" * len(cols))
              out.append("| Pairs | " + " | ".join(str(m[k]["n_pairs"]) for k, _ in cols) + " |")
              out.append("| Period | " + " | ".join(f"{m[k]['date_start']} → {m[k]['date_end']}" for k, _ in cols) + " |")
              out.append("| Area covered | " + " | ".join(pct(c[f"coverage_{ab[k]}"]) for k, _ in cols) + " |")
              out.append("| Mean coherence | " + " | ".join(f(c[f"coh_mean_{ab[k]}"], 2) for k, _ in cols) + " |")
              out.append("| Rate noise (mm/yr) | " + " | ".join(f(c[f"noise_{ab[k]}_mm_yr"]) for k, _ in cols) + " |")
              g = (m.get("validation") or {}).get("gnss")
              if g:
                  s = g["stats"]
                  out.append("| GNSS RMSE (mm/yr) | " + " | ".join(
                      f"{f(s.get(label, {}).get('rmse_mm_yr'))} (n={s.get(label, {}).get('n')})" for _, label in cols)
                      + " |")
              if len(cols) > 1:
                  out.append(f"\n**Agreement between satellites:** r = {f(c['pearson_r'], 2)}, slope "
                             f"{f(c['slope'], 2)}, RMS difference {f(c['rmsd_mm_yr'])} mm/yr over {c['n_joint']} "
                             "pixels.\n")
              out.append("### Interpretation notes\n")
              icon = {"good": "✅", "warn": "⚠️"}
              for n in m["notes"]:
                  out.append(f"- {icon.get(n['level'], 'ℹ️')} **{n['stage']}**: {n['text']}")
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(text + "\n")
          PY

      - name: 4. Diagnostics (GNSS stations, map statistics)
        if: always()
        run: |
          python scripts/diagnose_run.py "outputs/$SITE" | tee diagnosis.txt
          { echo "<details><summary>Diagnostics</summary>"; echo; echo '```'; cat diagnosis.txt; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"

      - name: 5. Sentinel-1 from ASF HyP3 (plan; order only if chosen)
        if: always() && env.HYP3 != 'skip'
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "$HYP3" = order ]; then extra=--order; else extra=; fi
          sarcompare --debug hyp3 "examples/$SITE.yaml" --max-pairs 4 $extra 2>&1 | tee hyp3.txt
          if [ "$HYP3" = check ]; then
            # check-only is sent only if HyP3's own API description offers it; otherwise nothing is sent
            sarcompare hyp3 "examples/$SITE.yaml" --max-pairs 4 --check-only 2>&1 | tail -n 3 | tee -a hyp3.txt || true
          fi
          { echo "<details><summary>Sentinel-1 from ASF HyP3 ($HYP3)</summary>"; echo; echo '```'; cat hyp3.txt; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.site }}
          path: outputs/
          retention-days: 30
          if-no-files-found: warn
